name: Deploy Through Their Eyes

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
    paths:
      - 'apps/throughtheireyes/**'
      - 'packages/**'
      - '.github/workflows/deploy-throughtheireyes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-throughtheireyes
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install at the workspace ROOT so npm workspaces + shared packages resolve
      # and react/react-dom/framer-motion/react-router-dom dedupe to a single copy.
      - name: Install dependencies (workspace root)
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build -w @fishbowl/throughtheireyes

      - name: Deploy to gh-pages/throughtheireyes
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/throughtheireyes/dist
          target-folder: throughtheireyes
          branch: gh-pages
          clean: true
