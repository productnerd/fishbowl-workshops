name: Deploy Fishbowl Workshops

# This is the WORKSHOPS build, and it lives only on the `workshops` branch, which is
# pushed to the separate productnerd/fishbowl-workshops repo as its `main`.
#
# The v1 consumer product is untouched: it deploys from `claude/fishbowl-monorepo` in
# productnerd/fishbowl, where this file still exists in its original form with
# VITE_BASE=/fishbowl/. Nothing here can reach that site. The two share no branch and no
# Pages target, so the live demo and survey links keep working.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/fishbowl/**'
      - 'packages/**'
      - '.github/workflows/deploy-workshops.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-workshops
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (workspace root)
        run: npm install --legacy-peer-deps

      # Includes the v1 survey parity test, so a config change that silently alters the
      # original question set fails the deploy rather than shipping.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build -w @fishbowl/fishbowl
        env:
          VITE_BASE: /fishbowl-workshops/

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/fishbowl/dist
          target-folder: .
          branch: gh-pages
          clean: true
